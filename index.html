<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#08090d"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black"><meta name="apple-mobile-web-app-title" content="오백회"><style>:root{color-scheme:dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}</style></head><body><title>오백회 사건파일</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700&family=Nanum+Pen+Script&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: dark;
  --stage:#08090d; --bezel:#1b1c22; --bg:#000; --grp:#1c1c1e; --grp2:#2c2c2e; --line:rgba(84,84,88,.6);
  --fg:#fff; --fg2:rgba(235,235,245,.64); --fg3:rgba(235,235,245,.36);
  --blue:#0a84ff; --green:#30d158; --red:#ff453a; --yellow:#ffd60a; --orange:#ff9f0a;
  --ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","Noto Sans KR","Apple SD Gothic Neo",system-ui,sans-serif;
  --doc:"Nanum Myeongjo","Noto Serif KR",serif;
  --hand:"Nanum Pen Script","Segoe Script",cursive;
}
html,body{height:100%}
@supports (height:100dvh){html,body{height:100dvh}}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;overscroll-behavior:none}
*{-webkit-tap-highlight-color:transparent}
body{margin:0;box-sizing:border-box;background:var(--stage);color:var(--fg);font-family:var(--ui);
  padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background-image:radial-gradient(ellipse at 50% 0%,#151926 0%,transparent 60%)}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer;-webkit-appearance:none;appearance:none;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.scroll,.chat,.panel{-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.stage{height:100%;display:grid;place-items:center}
.phone{position:relative;width:min(100%,392px);height:min(100%,820px);background:var(--bg);border-radius:50px;border:10px solid var(--bezel);
  box-shadow:0 0 0 1px #2b2d36,0 30px 80px rgba(0,0,0,.7);overflow:hidden;display:flex;flex-direction:column;isolation:isolate;font-size:15px}
@media (max-width:440px){.phone{border-width:0;border-radius:0;width:100%}.island,.status svg{display:none}.status{height:34px;padding:0 22px 4px}}
.island{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:104px;height:30px;background:#000;border-radius:20px;z-index:50}
.status{flex:none;height:48px;display:flex;justify-content:space-between;align-items:flex-end;padding:0 30px 6px 34px;font-weight:600;font-size:15px;z-index:40;position:relative;background:transparent}
.status svg{height:12px;fill:#fff;margin-left:5px}
.screen{flex:1;position:relative;min-height:0;overflow:hidden}
.homebar{flex:none;height:24px;display:grid;place-items:center;background:var(--bg);border:0;width:100%}
.homebar i{width:130px;height:5px;border-radius:3px;background:#fff;opacity:.85}
.view{position:absolute;top:0;right:0;bottom:0;left:0;display:flex;flex-direction:column;background:var(--bg)}
.nav{flex:none;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:44px;padding:0 8px}
.nav .t{font-weight:600;font-size:16px;text-align:center}
.back{justify-self:start;background:none;border:0;color:var(--blue);display:flex;align-items:center;gap:2px;font-size:16px;padding:8px}
.back svg{width:11px;height:18px}
.navr{justify-self:end}
.pill{background:var(--grp2);border:0;border-radius:99px;padding:6px 12px;font-size:13px;color:var(--blue)}
.pill.on{background:var(--blue);color:#fff}
.scroll{flex:1;overflow-y:auto;padding:4px 16px 24px;min-height:0}
.h1{font-size:28px;font-weight:700;margin:6px 0 4px;letter-spacing:-.02em}
.sub{color:var(--fg2);font-size:13px;line-height:1.5}
.cap{color:var(--fg2);font-size:12px;text-transform:none;letter-spacing:.04em;margin:18px 4px 6px}
.grp{background:var(--grp);border-radius:12px;overflow:hidden;margin:6px 0}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;width:100%;background:none;border:0;border-bottom:.5px solid var(--line);text-align:left;min-height:48px}
.row:last-child{border-bottom:0}
.row:active{background:var(--grp2)}
.row .tx{flex:1;min-width:0}
.row b{font-weight:500;display:block}
.row small{display:block;color:var(--fg2);font-size:12.5px;line-height:1.45;margin-top:2px}
.row .chev{color:var(--fg3);font-size:18px}
.row[disabled]{opacity:.45}
.dot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--fg3)}
.dot.y{background:var(--yellow)}.dot.b{background:var(--blue)}.dot.r{background:var(--red)}.dot.g{background:var(--green)}.dot.o{background:var(--orange)}
.chip{font-size:11px;padding:2px 7px;border-radius:99px;background:var(--grp2);color:var(--fg2);flex:none}
.chip.ok{background:rgba(48,209,88,.16);color:var(--green)}
.btn{display:block;width:100%;border:0;border-radius:14px;background:var(--blue);color:#fff;font-weight:600;font-size:16px;padding:14px;margin-top:12px}
.btn.alt{background:var(--grp2);color:var(--blue)}
.btn[disabled]{opacity:.35}
.lock{background:linear-gradient(165deg,#1a2234 0%,#0a0d15 58%,#1a1120 100%);align-items:center;text-align:center;padding:34px 18px 18px}
.lock::before{content:"";position:absolute;top:0;right:0;bottom:0;left:0;background:repeating-linear-gradient(105deg,transparent 0 9px,rgba(160,190,255,.035) 9px 10px);pointer-events:none}
.lock .case{font-size:11px;letter-spacing:.3em;color:var(--fg2);margin-top:6px}
.lock .time{font-size:88px;font-weight:300;letter-spacing:-.04em;line-height:1;margin-top:22px}
.lock .date{color:var(--fg2);margin-top:6px}
.lock .spacer{flex:1}
.notif{position:relative;width:100%;text-align:left;border:0;background:rgba(60,64,80,.55);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-radius:20px;padding:12px 14px;display:flex;gap:12px;align-items:flex-start;animation:rise .7s .3s both}
.notif b{display:block;font-size:14px}.notif span{display:block;font-size:13.5px;color:#d9dbe6;line-height:1.45;margin-top:2px}
.notif em{font-style:normal;font-size:12px;color:var(--fg2);margin-left:auto;flex:none}
.fine{font-size:11px;color:var(--fg3);line-height:1.5;margin-top:14px;max-width:290px;position:relative}
.home{background:linear-gradient(170deg,#141a28 0%,#07090e 65%,#17101c 100%);padding:6px 18px 16px}
.widget{background:rgba(40,44,58,.6);border-radius:22px;padding:14px 16px;margin:6px 0 20px}
.widget h4{margin:0 0 10px;font-size:12px;letter-spacing:.08em;color:var(--fg2);font-weight:500}
.bar{height:6px;background:rgba(255,255,255,.12);border-radius:3px;overflow:hidden;margin:5px 0 10px}
.bar i{display:block;height:100%;background:var(--yellow);border-radius:3px;transition:width .5s}
.bar.bl i{background:var(--blue)}
.wl{display:flex;justify-content:space-between;font-size:13px}
.apps{display:grid;grid-template-columns:repeat(4,1fr);gap:20px 8px}
.app{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11.5px;position:relative}
.app .ic{width:58px;height:58px;border-radius:14px;display:grid;place-items:center}
.app .ic svg{width:30px;height:30px}
.badge{position:absolute;top:-5px;right:2px;background:var(--red);color:#fff;font-size:11px;font-weight:700;min-width:20px;height:20px;border-radius:10px;display:grid;place-items:center;padding:0 5px}
.notif .ic svg{width:21px;height:21px}
.board-tile{margin-top:26px;width:100%;text-align:left;border:0;border-radius:20px;padding:16px;display:flex;gap:14px;align-items:center;background:linear-gradient(135deg,#3a1e24,#21141e)}
.board-tile b{display:block;font-size:15px}.board-tile span{font-size:12.5px;color:var(--fg2)}
.i-msg{background:linear-gradient(#5be07a,#1fb84a)}.i-map{background:linear-gradient(#4cc3ff,#1673e6)}
.i-ev{background:linear-gradient(#ffd45a,#ff9f0a)}.i-ppl{background:linear-gradient(#a2a6b6,#5f6372)}.i-brd{background:linear-gradient(#ff6a5f,#c4223a)}
.banner{position:absolute;top:50px;left:10px;right:10px;z-index:60;background:rgba(48,50,62,.92);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-radius:20px;padding:10px 12px;display:flex;gap:10px;align-items:center;transform:translateY(-140%);transition:transform .45s cubic-bezier(.2,.9,.3,1.1);pointer-events:none}
.banner.show{transform:none}
.banner .ic{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex:none}
.banner .ic svg{width:17px;height:17px}
.banner b{font-size:12px;color:var(--fg2);font-weight:500;display:block}.banner span{font-size:13.5px}
.sheet-wrap{position:absolute;top:0;right:0;bottom:0;left:0;z-index:55;display:none}
.sheet-wrap.show{display:block}
.scrim{position:absolute;top:0;right:0;bottom:0;left:0;background:rgba(0,0,0,.55);animation:fade .25s both}
.panel{position:absolute;left:0;right:0;bottom:0;max-height:88%;overflow-y:auto;background:#1c1c1e;border-radius:26px 26px 0 0;padding:8px 16px 28px;animation:up .35s cubic-bezier(.2,.9,.3,1) both}
.grab{width:38px;height:5px;border-radius:3px;background:#555;margin:2px auto 12px}
.evh{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.evh h3{margin:0;font-size:19px}
.tag{font-size:11px;padding:3px 8px;border-radius:99px;background:rgba(255,214,10,.16);color:var(--yellow);flex:none}
.panel p{line-height:1.6;color:#e7e7ee;margin:8px 0}
.paper{background:#e4e6ea;color:#1b1d21;border-radius:6px;padding:16px;font-family:var(--doc);line-height:1.75;font-size:13.5px;box-shadow:0 2px 0 rgba(0,0,0,.4)}
.paper h4{margin:0 0 8px;font-size:15px;text-align:center;letter-spacing:.2em}
.paper ul{margin:6px 0;padding-left:18px}
.paper .stamp{display:inline-block;border:2px solid #b3262f;color:#b3262f;padding:1px 8px;transform:rotate(-4deg);font-weight:700;margin-top:8px;letter-spacing:.1em}
.hanji{background:#e6e0cc}
.sigs{display:grid;grid-template-columns:1fr 1fr;gap:2px 14px;margin-top:10px}
.sigs span{font-family:var(--hand);font-size:25px;color:#1b2a4a;line-height:1.2;transform:rotate(-2deg)}
.sigs span:nth-child(even){transform:rotate(1.5deg)}
.lined{background:#e9e5d3 repeating-linear-gradient(transparent 0 29px,rgba(70,90,130,.28) 29px 30px);font-family:var(--hand);font-size:23px;line-height:30px;color:#1b2a4a;padding:10px 16px 14px}
.lined p{margin:0;color:#1b2a4a}
.smear{text-shadow:5px 1px 3px rgba(27,42,74,.5),10px 2px 6px rgba(27,42,74,.28)}
.imsg{display:flex;flex-direction:column;gap:6px;background:#000;border-radius:14px;padding:12px}
.imsg .b{max-width:82%;padding:8px 12px;border-radius:18px;line-height:1.45;font-size:14.5px}
.imsg .l{background:#26262a;align-self:flex-start}.imsg .r{background:var(--blue);align-self:flex-end}
.imsg small{align-self:center;color:var(--fg3);font-size:11px}
.photo{border-radius:10px;overflow:hidden;background:#0c0f14;margin-bottom:8px}
.photo svg{display:block;width:100%;height:auto}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:12.5px}
.chat{flex:1;overflow-y:auto;padding:8px 14px 14px;display:flex;flex-direction:column;gap:7px;min-height:0}
.bub{max-width:80%;padding:9px 13px;border-radius:19px;line-height:1.5;font-size:15px}
.bub.new,.att.new{animation:pop .25s both}
.bub.them{background:#26262a;align-self:flex-start;border-bottom-left-radius:6px}
.bub.me{background:var(--blue);align-self:flex-end;border-bottom-right-radius:6px}
.bub.sys{align-self:center;background:none;color:var(--fg2);font-size:12px;text-align:center;max-width:92%}
.typing{align-self:flex-start;background:#26262a;border-radius:19px;padding:12px 15px;display:flex;gap:4px}
.typing i{width:7px;height:7px;border-radius:50%;background:#8e8e93;animation:blink 1.1s infinite}
.typing i:nth-child(2){animation-delay:.18s}.typing i:nth-child(3){animation-delay:.36s}
.att{align-self:flex-start;max-width:80%;width:240px;background:#26262a;border:0;border-radius:16px;padding:10px 12px;display:flex;gap:10px;align-items:center;text-align:left}
.att .ai{width:36px;height:36px;border-radius:9px;background:linear-gradient(#ffd45a,#ff9f0a);display:grid;place-items:center;flex:none}
.att .ai svg{width:20px;height:20px}
.att b{font-size:13.5px;display:block}.att small{font-size:11.5px;color:var(--fg2)}
.att.got small{color:var(--green)}
.dock{flex:none;padding:10px 14px 8px;border-top:.5px solid var(--line);background:#0b0b0c}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.q{background:var(--grp2);border:0;border-radius:16px;padding:8px 12px;font-size:13.5px;text-align:left;line-height:1.35}
.q.ev{background:rgba(10,132,255,.18);color:#6cb4ff}
.q[disabled]{opacity:.35}
.meter{margin:0 16px 6px;flex:none}
.meter .wl{font-size:11.5px;color:var(--fg2)}
.meter .bar{margin:4px 0 4px}.meter .bar i{background:linear-gradient(90deg,var(--orange),var(--red))}
.person{display:flex;gap:10px;align-items:center;padding:0 16px 8px;flex:none}
.av{width:38px;height:38px;border-radius:50%;background:var(--grp2);display:grid;place-items:center;font-weight:700;flex:none}
.map{position:relative;border-radius:16px;overflow:hidden;background:#10141b;aspect-ratio:340/270;margin:6px 0 12px}
.map svg{position:absolute;top:0;right:0;bottom:0;left:0;width:100%;height:100%}
.pin{position:absolute;transform:translate(-50%,-100%);background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:2px}
.pin i{width:22px;height:22px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--red);border:2px solid #fff;display:block;box-shadow:0 2px 6px rgba(0,0,0,.6)}
.pin span{font-size:11px;background:rgba(0,0,0,.72);padding:2px 7px;border-radius:8px;white-space:nowrap}
.pin.new i{background:var(--yellow);animation:ping 1.4s infinite}
.scene{font-family:var(--doc);line-height:1.8;color:#cfd2de;font-size:14px;margin:6px 2px 10px}
.seg{display:flex;background:var(--grp);border-radius:9px;padding:2px;margin:4px 16px 8px;flex:none}
.seg button{flex:1;border:0;background:none;padding:7px;border-radius:7px;font-size:13px;color:var(--fg)}
.seg button.on{background:#636366;font-weight:600}
.pick{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;width:100%;background:none;border:0;border-bottom:.5px solid var(--line);text-align:left;line-height:1.45}
.pick:last-child{border-bottom:0}
.pick .rd{width:20px;height:20px;border-radius:50%;border:2px solid var(--fg3);flex:none;margin-top:1px}
.pick.on .rd{border-color:var(--blue);background:radial-gradient(var(--blue) 0 45%,transparent 50%)}
.cbar{flex:none;padding:10px 16px;border-top:.5px solid var(--line);background:#0b0b0c}
.sel .ck{width:22px;height:22px;border-radius:50%;border:2px solid var(--fg3);flex:none;display:grid;place-items:center;font-size:13px;line-height:1}
.sel.on .ck{background:var(--blue);border-color:var(--blue)}
.rank{width:92px;height:92px;border-radius:50%;display:grid;place-items:center;font-size:44px;font-weight:700;margin:10px auto 6px;border:3px solid var(--yellow);color:var(--yellow)}
.end p{font-family:var(--doc);line-height:1.85;color:#d6d8e2;margin:12px 2px;font-size:14.5px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.stats div{background:var(--grp);border-radius:12px;padding:10px;text-align:center;font-size:11.5px;color:var(--fg2)}
.stats b{display:block;font-size:20px;color:#fff;font-weight:600}
@keyframes pop{from{opacity:0;transform:translateY(6px) scale(.97)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes blink{0%,60%,100%{opacity:.3}30%{opacity:1}}
@keyframes ping{0%,100%{box-shadow:0 0 0 0 rgba(255,214,10,.5)}50%{box-shadow:0 0 0 10px rgba(255,214,10,0)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<div class="stage">
  <div class="phone" id="phone">
    <div class="island"></div>
    <div class="status"><span id="clock">14:00</span>
      <span style="display:flex;align-items:center">
        <svg viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="2.5" width="3" height="9.5" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
        <svg viewBox="0 0 27 12"><rect x="0.5" y="0.5" width="22" height="11" rx="3.5" fill="none" stroke="#fff" opacity=".5"/><rect x="2" y="2" width="16" height="8" rx="2"/><rect x="24" y="4" width="2" height="4" rx="1" opacity=".5"/></svg>
      </span>
    </div>
    <div class="screen" id="screen"></div>
    <button class="homebar" id="homebar" aria-label="홈으로"><i></i></button>
    <div class="banner" id="banner"></div>
    <div class="sheet-wrap" id="sheet"></div>
